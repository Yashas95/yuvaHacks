# Fast checks on every push: the scoring and plain-language rules (tests/test_core.py) and the Chrome
# extension's JavaScript. They need no ML models. The full pipeline is checked locally with tools/regress.py,
# because most of its evidence files are real people's media and never go to GitHub.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    container: python:3.15-slim    # same Python as the Dockerfile
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the libraries the rules import (versions pinned in requirements-hosted.txt)
        run: pip install --no-cache-dir $(grep -E '^(numpy|scipy|opencv-python-headless|pillow|matplotlib)==' requirements-hosted.txt)
      - run: python tests/test_core.py

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check the extension scripts
        run: for f in extension/*.js; do node --check "$f"; echo "ok  $f"; done
      - name: Manifest is valid JSON
        run: python3 -m json.tool extension/manifest.json > /dev/null && echo "ok  manifest.json"
