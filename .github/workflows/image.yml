# Builds the TruthLens image (Dockerfile: ffmpeg, pinned packages, models baked in) on GitHub Actions and
# publishes it to GitHub's container registry. Codespaces (and any server) then just pull the finished image,
# so no deployment ever depends on reaching PyPI/Hugging Face at start-up time.
name: Build TruthLens image

on:
  push:
    branches: [main]
    paths: [Dockerfile, requirements-hosted.txt, download_models.py, app.py, "truthlens/**", "web/**", "weights/**", "test_assets/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space (image is ~5 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/yashas95/truthlens:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
